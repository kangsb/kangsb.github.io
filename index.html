<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB Works</title>
  <meta name="description" content="SB Works - Speedy Build, Smart Solutions.">
  <meta property="og:title" content="SB Works">
  <meta property="og:description" content="Speedy Build, Smart Solutions.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/brand/app-icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/app-icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/app-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 헤더·히어로·푸터는 라이트/다크 모두 Pine 배경이라 reverse 로고를 쓴다 -->
  <header class="nav">
    <nav class="container nav-inner" aria-label="Main">
      <a href="#top" class="logo" aria-label="SB Works">
        <img src="assets/brand/lockup-horizontal-reverse.svg" alt="SB Works" width="150" height="34">
      </a>
      <div id="menu" class="menu">
        <a href="#services" data-i18n="nav.services"></a>
        <a href="#process" data-i18n="nav.process"></a>
        <a href="#projects" data-i18n="nav.projects"></a>
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#contact" class="btn btn-sm" data-i18n="nav.cta"></a>
      </div>
      <div class="nav-actions">
        <button id="lang-toggle" class="btn-ghost" type="button" aria-label="Change language">EN</button>
        <button id="menu-toggle" class="btn-ghost menu-toggle" type="button" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="mono" data-i18n="hero.eyebrow"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="hero-desc" data-i18n="hero.desc"></p>
          <div class="hero-actions">
            <a href="#contact" class="btn" data-i18n="hero.cta"></a>
            <a href="#services" class="btn btn-outline" data-i18n="hero.cta2"></a>
          </div>
        </div>
        <div class="stairs">
          <div class="stair s3"><i class="blk sun" aria-hidden="true"></i><div><span class="num">03</span><strong data-i18n="hero.s3"></strong></div></div>
          <div class="stair s2"><i class="blk mint" aria-hidden="true"></i><div><span class="num">02</span><strong data-i18n="hero.s2"></strong></div></div>
          <div class="stair s1"><i class="blk white" aria-hidden="true"></i><div><span class="num">01</span><strong data-i18n="hero.s1"></strong></div></div>
        </div>
      </div>
    </section>

    <section id="services" class="section">
      <div class="container stack">
        <div class="head">
          <p class="label" data-i18n="services.label"></p>
          <h2 data-i18n="services.title"></h2>
        </div>
        <div class="grid services-grid">
          <article class="panel service">
            <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></svg>
            <h3 data-i18n="service.1.title"></h3>
            <p data-i18n="service.1.desc"></p>
          </article>
          <article class="panel service">
            <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="18" x2="9" y2="22"/><line x1="15" y1="18" x2="15" y2="22"/><line x1="2" y1="9" x2="6" y2="9"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="22" y2="9"/><line x1="18" y1="15" x2="22" y2="15"/></svg>
            <h3 data-i18n="service.2.title"></h3>
            <p data-i18n="service.2.desc"></p>
          </article>
          <article class="panel service">
            <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <h3 data-i18n="service.3.title"></h3>
            <p data-i18n="service.3.desc"></p>
          </article>
        </div>
      </div>
    </section>

    <section id="process" class="section alt">
      <div class="container stack">
        <div class="head">
          <p class="label" data-i18n="process.label"></p>
          <h2 data-i18n="process.title"></h2>
        </div>
        <div class="grid steps-grid">
          <div class="step step-1"><span class="mono num">01</span><h3 data-i18n="step.1.title"></h3><p data-i18n="step.1.desc"></p></div>
          <div class="step step-2"><span class="mono num">02</span><h3 data-i18n="step.2.title"></h3><p data-i18n="step.2.desc"></p></div>
          <div class="step step-3"><span class="mono num">03</span><h3 data-i18n="step.3.title"></h3><p data-i18n="step.3.desc"></p></div>
          <div class="step step-4"><span class="mono num">04</span><h3 data-i18n="step.4.title"></h3><p data-i18n="step.4.desc"></p></div>
        </div>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="container stack">
        <div class="head">
          <p class="label" data-i18n="projects.label"></p>
          <h2 data-i18n="projects.title"></h2>
        </div>
        <div class="grid projects-grid" id="project-grid"></div>
      </div>
    </section>

    <section id="contact" class="cta">
      <div class="container cta-inner">
        <div class="cta-text">
          <h2 data-i18n="contact.title"></h2>
          <!-- TODO: 실제 이메일/SNS 주소로 교체 -->
          <p><a href="mailto:hello@example.com">hello@example.com</a> · <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></p>
        </div>
        <a href="mailto:hello@example.com" class="btn btn-sun" data-i18n="contact.cta"></a>
      </div>
    </section>
  </main>

  <footer id="about" class="footer">
    <div class="container footer-inner">
      <a href="#top" class="logo" aria-label="SB Works">
        <img src="assets/brand/lockup-horizontal-reverse.svg" alt="SB Works" width="123" height="28">
      </a>
      <div class="footer-info">
        <span data-i18n="footer.info"></span><br>
        © <span id="year"></span> SB Works. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
